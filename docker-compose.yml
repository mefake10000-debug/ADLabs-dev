# Pins the default Compose project name to "adlabs" (used below to build each container_name),
# so `docker compose up` gives the same container names as always regardless of which directory
# name the repo happens to be checked out under. `docker compose -p <other-name> up` (e.g. to run
# a second environment side by side, as in docs/recorded-run-analysis.md §9) then gets distinctly
# named containers instead of colliding with this one -- container_name used to be hardcoded,
# which silently ignored -p entirely and made two stacks fight over the same container names.
name: adlabs

services:
  # 1. Synthetic RTSP Multi-Camera Broadcaster
  rtsp-simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulator
    container_name: ${COMPOSE_PROJECT_NAME}-rtsp-simulator
    ports:
      - "8554:8554"   # RTSP stream port
    volumes:
      - ./data/sample_videos:/app/data/sample_videos:ro
    restart: unless-stopped

  # 2. On-Premise Edge Analytics Engine
  edge-analyzer:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge
      args:
        # CPU-only torch by default; set TORCH_INDEX_URL=https://download.pytorch.org/whl/cu130 for NVIDIA GPU hosts
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: ${COMPOSE_PROJECT_NAME}-edge-analyzer
    depends_on:
      - rtsp-simulator
      - cloud-dashboard
    volumes:
      - ./configs:/app/configs:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro   # benchmark scripts + ground truth run without rebuilding the image
      - ./data/sample_videos:/app/data/sample_videos:ro
      - ./data/storage:/app/data/storage
      - ./models:/app/models
      # CLIP text encoder for YOLO-World (host: weights/clip/ViT-B-32.pt → /app/weights/clip/)
      - ./weights:/app/weights:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PIPELINE_CONFIG=/app/configs/pipeline.yaml
      - CAMERAS_CONFIG=/app/configs/cameras.yaml
      # Unset by default -- state-changing API calls stay unauthenticated (today's zero-config
      # behaviour) unless you set this to the same value on cloud-dashboard below.
      - EDGESIGHT_API_KEY=${EDGESIGHT_API_KEY:-}
      # Optional override if CLIP lives elsewhere; default path matches the mount above.
      - CLIP_WEIGHTS_PATH=${CLIP_WEIGHTS_PATH:-/app/weights/clip/ViT-B-32.pt}
    restart: unless-stopped

  # 3. Cloud Telemetry Ingestion & Web Analytics Dashboard
  cloud-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: ${COMPOSE_PROJECT_NAME}-cloud-dashboard
    ports:
      - "8000:8000"   # FastAPI Telemetry Ingestion Endpoint
      - "8501:8501"   # Streamlit Real-Time Operations UI
    # baseUrlPath aligns Streamlit with portal route /dashboard/live/ops (website embeds this).
    command:
      [
        "sh",
        "-c",
        "uvicorn server.app:app --host 0.0.0.0 --port 8000 & streamlit run server/dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.baseUrlPath=/dashboard/live/ops --browser.gatherUsageStats=false",
      ]
    volumes:
      - ./server:/app/server:ro
      - ./configs:/app/configs
      - ./data/storage:/app/data/storage
      - ./data/sample_videos:/app/data/sample_videos:ro   # lets the dashboard list/validate selectable video sources
    environment:
      - PYTHONUNBUFFERED=1
      - CAMERAS_CONFIG=/app/configs/cameras.yaml
      - EDGESIGHT_API_KEY=${EDGESIGHT_API_KEY:-}
      # Browser-facing API for Streamlit <img> tags — portal reverse-proxy on :3000
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-http://localhost:3000}
      - PORTAL_LIVE_URL=${PORTAL_LIVE_URL:-http://localhost:3000/dashboard/live}
      # In-container calls still hit local uvicorn
      - API_BASE_URL=${API_BASE_URL:-http://127.0.0.1:8000}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

