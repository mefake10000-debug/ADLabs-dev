# AD Labs EdgeSight - Pipeline Configuration

edge:
  store_id: "store_mumbai_001"
  device_id: "edge_node_macmini_01"
  hardware_backend: "auto" # "auto", "coreml", "cuda", or "cpu"

# --- Live FPS / demo performance ----------------------------------------------
# Docker on Mac ARM is CPU-only: pose + YuNet + YOLO-World/CLIP on every stream
# collapses infer FPS to ~0.3–1. Default is **balanced** so people in frame are
# detected reliably; use fast only when you need max display FPS and accept misses.
#
# Switch modes (either works):
#   EDGE_PERF_MODE=fast|balanced|quality # compose / shell env (wins over yaml)
#   performance.mode: fast|balanced|quality  # this file
#   EDGE_MAX_CAMERAS=2                   # all configured views; reduce only for a measured FPS budget
#   EDGESIGHT_DETECT_MODEL=…             # optional YOLO weight override
#   DETECTOR_BACKEND=yolo26|rfdetr       # fast/balanced→yolo26; quality→rfdetr (SOTA) unless set
#   RFDETR_VARIANT=nano|small            # Apache-2.0 sizes only
#   OVERLAY_BOX_STYLE=foot|skeleton|parallel|aabb  # default foot (red mark + trail)
#   ENABLE_RTMPOSE=1                     # ankle feet via RTMPose ONNX when packed
#
# See docs/live-fps.md, docs/foot-tracking-retail-models.md, docs/rfdetr-integration.md.
performance:
  mode: "balanced"            # balanced (local demo default) | fast | quality
  imgsz: 416                  # Ultralytics letterbox; fast=320, quality YOLO=640; RF-DETR fixed
  infer_every_n: 2            # denser tracks than fast(3); quality uses 1
  display_every_n: 1          # smooth MJPEG from last tracks between infer frames
  # Docker CPU demo: 1 cam. Peer fusion can raise EDGE_MAX_CAMERAS after measuring KPI floor.
  max_cameras: 1

perception:
  # Balanced/fast default: YOLO26n. Quality defaults to RF-DETR (Apache SOTA) unless
  # DETECTOR_BACKEND=yolo26. Leave detector_backend unset to honor EDGE_PERF_MODE defaults.
  # detector_backend: "yolo26"   # optional hard pin: yolo26 | rfdetr
  rfdetr_variant: "nano"         # nano | small (Apache-2.0 only; not XL/2XL)
  model_name: "models/yolo26n.pt"
  imgsz: 416
  infer_every_n: 2
  display_every_n: 1
  confidence_threshold: 0.25  # Detector's own floor -- kept low deliberately. The real "is this a
                               # real person" bar is tracking.track_thresh below; detections between
                               # this floor and track_thresh can only extend a track that already
                               # exists (ByteTrack low-confidence recovery), never start a new one.
                               # Benchmark evidence (docs/tracking-benchmark.md): at 0.50 as a single
                               # threshold, ~15 points of recall were partially-occluded people YOLO
                               # did see, just below 0.50.
  iou_threshold: 0.45         # Suppress duplicate overlapping boxes on the same person
  min_height: 95              # Suppress small shelf items and price tags
  min_width: 30
  min_aspect_ratio: 1.0       # Suppress wide/horizontal displays (baskets, flat signs)
  max_aspect_ratio: 4.2       # Suppress vertical slivers / poles
  min_area: 3000
  classes: [0]                # Class 0 is 'person' in COCO
  require_model: true         # Fail at startup if YOLO cannot load, instead of silently reporting zero people

tracking:
  tracker_type: "bytetrack"
  track_thresh: 0.50          # Bar for STARTING a new track. Detections below this (but above
                               # perception.confidence_threshold) can only extend an existing track.
  match_thresh: 0.45          # Tuned IoU matching to prevent ID switching & track fragmentation
  track_buffer: 45            # Max frames to keep lost track alive
  min_hits: 4                 # Temporal confirmation to eliminate 1-frame detector flicker
  stationary_policy: "tag"    # "tag": stationary tracks (e.g. someone standing still in a queue)
                               # are still returned, with is_stationary=True, so zones/queues can
                               # count them -- only the tripwire ignores the flag (it already did).
                               # "suppress": old behaviour, drop them entirely. Use "suppress" for a
                               # camera with a known cardboard-cutout/mannequin false-positive problem.

analytics:
  zone_exit_grace_seconds: 3.0  # A track missing from a dwell/queue zone for less than this is still
                                  # counted as present, so a single dropped detection doesn't reset
                                  # dwell time or make someone flicker in and out of a queue count.

# Cross-camera identity is opt-in and fail-closed. Enable only after each shared
# physical zone has the same store_zone_id in every covering camera and every camera
# has a pixel→store-floor homography in cameras.yaml. ReID is session-only; IDs never leave memory.
cross_camera_fusion:
  enabled: false
  association_window_seconds: 1.5
  cosine_similarity_min: 0.86
  max_floor_distance_m: 2.5
  gallery_ttl_seconds: 20

# --- Perception model tier ------------------------------------------------------
# Everything above this line is the "fast tier": person detection + tracking +
# tripwire/zone/queue analytics. The block below adds enrichment models (pose, face,
# demographics, open-vocabulary products) on a slower cadence.
#
# Fast/balanced keep models.enabled: false so Docker CPU demos stay at usable FPS.
# Quality mode (EDGE_PERF_MODE=quality) does NOT silently re-enable enrichment:
# every models.* block stays exactly as configured below. Flip models.enabled (or
# export EDGE_ENRICHMENT=1) on purpose, and watch the FPS column while you do.
#
# Weights are not committed (see .gitignore). Run `python scripts/download_models.py`
# once after cloning.
models:
  # Master switch for the enrichment tier. Fast mode forces this off even if true.
  enabled: false
  device: "auto"              # auto (CUDA -> MPS -> CPU) | cuda | mps | cpu
  # The enrichment tier runs on its own thread while the fast tier keeps inferring.
  # PyTorch's MPS backend is not thread-safe, so when the fast tier owns MPS the
  # enrichment tier is moved to the CPU. "auto" picks the safe combination.
  enrichment_device: "auto"   # auto | cuda | mps | cpu
  # Worker threads for the enrichment tier. The fast tier's detector and the
  # enrichment tier share the machine, so letting each library spawn one worker per
  # core oversubscribes it and slows the fast tier down. 3 leaves the detector room
  # on an 8-thread machine.
  enrichment_threads: 3
  slow_tier:
    # Measured per-pass cost on this Mac (8-core M-series, CPU provider):
    #   pose 189ms + face 42ms + open-vocab 91ms + 67ms per demographic face.
    # At interval_frames=8 and 3 faces per pass a pass costs ~520ms, which leaves the
    # fast tier (MPS, ~14 FPS) enough headroom to stay at full rate.
    # In Docker CPU, prefer interval_frames >= 16 or keep models.enabled: false.
    interval_frames: 16       # run the enrichment pass every N processed frames
    max_faces_per_tick: 2     # cap face-model inferences per pass (keeps the tick bounded)
    max_products_per_tick: 12 # cap open-vocabulary detections fed to the interest model

  pose:
    enabled: false            # enrichment-tier gate (deliberate; quality mode never auto-enables)
    weights: "models/yolo26m-pose.pt"
    confidence: 0.30
    match_iou: 0.30           # min IoU to bind a pose to an existing track

  face:
    enabled: false
    # YuNet = face boxes for redaction / attribute gating — NOT shopper identity.
    # Pack mirror: models/pack/04-face-attr/face_detection_yunet_2023mar.onnx
    weights: "models/onnx/face_detection_yunet_2023mar.onnx"
    score_threshold: 0.55
    min_face_px: 30           # faces smaller than this are too noisy for the attribute model
    upscale_crops: true       # re-detect inside an upscaled person crop when no face was found
    align: true               # warp the face onto the canonical 5-point template before inference

  demographics:
    enabled: false
    weights: "models/onnx/age_gender_vit.onnx"
    # INT8 copy of the same network: 1.7x faster on CPU with predictions within ~0.5y
    # of the FP32 model on the sample footage. Used automatically when present.
    quantized_weights: "models/onnx/age_gender_vit_int8.onnx"
    # CoreML EP is measurably slower than CPU for this graph (1.3s/face vs 0.28s) and
    # corrupts the INT8 output, so demographics are pinned to the CPU provider.
    providers: ["CPUExecutionProvider"]
    k_anonymity: 10           # cohorts smaller than this are withheld from every API response
    smoothing_alpha: 0.35     # EMA weight for the newest face-model reading
    window_seconds: 3600      # rolling window for the population mix (departed shoppers are
                               # counted as aggregates only; per-person state is deleted)

  head_pose:
    enabled: false
    focal_scale: 1.0          # 1.0 => focal length equals frame width

  products:
    enabled: false            # enrichment-tier gate (deliberate; quality mode never auto-enables)
    backend: "yoloe"
    weights: "models/yolov8s-worldv2.pt"
    shelf_weights: "models/pack/06-shelf/yoloe-v8s-seg-pf.pt"
    confidence: 0.20
    max_person_overlap: 0.5   # drop detections that are really a shopper wearing the item
    engagement_radius_px: 160 # how close a shopper must be to count as viewing a product
    min_dwell_seconds: 1.0    # dwell below this is a glance, not an interest
    vocabulary:
      - shoe
      - handbag
      - backpack
      - suitcase
      - shirt
      - dress
      - jacket
      - hat
      - watch
      - eyeglasses
      - phone
      - bottle
      - shopping cart
      - umbrella


  # Soft body ReID (OSNet). Default OFF — DPDP / no face ReID / no multi-day gallery.
  # Session-scoped embeddings only; SoftReIdExtractor also probes verified pack paths.
  # Cross-cam global_person_id still requires NTP + overlap + fusion (not shipped).
  # Session-scoped OSNet ReID. Computed only when the enrichment tier runs
  # (models.enabled / EDGE_ENRICHMENT); the fast tier alone never embeds crops.
  reid:
    enabled: true
    weights: "models/pack/03-reid/osnet_x0_25_msmt17_combineall_256x128_amsgrad_ep150_stp60_lr0.0015_b64_fb10_softmax_labelsmooth_flip_jitter.pth"
    onnx_weights: "models/pack/03-reid/osnet_x0_25_msmt17.onnx"
    # Alternatives (same SoftReIdExtractor fallback chain):
    #   models/pack/03-reid/osnet_x1_0_msmt17_combineall_256x128_amsgrad_ep150_stp60_lr0.0015_b64_fb10_softmax_labelsmooth_flip_jitter.pth
    #   models/pack/03-reid/osnet-x0_25/osnet_x0_25_msmt17.pt   # legacy nested
    device: "cpu"
    interval_frames: 16       # sample embeddings slower than pose/face enrichment
    max_crops_per_tick: 4
    gallery_ttl_seconds: 3600

multicam:
  # Association window for *future* handoff fusion (not active until ReID+overlap wired).
  association_window_seconds: 1.5
  occupancy_mode: "sum"      # "sum" today · "consensus" only after fusion ships

storage:
  db_path: "data/storage/edgesight.db"
  rollup_interval_seconds: 10

telemetry:
  # Cloud ingest (optional). Local Docker demos should rely on local_endpoint —
  # Vercel marketing site does not accept edge rollups, so this will fail closed.
  cloud_endpoint: "https://adlabs-site.vercel.app/api/v1/telemetry"
  # Local FastAPI ingest. Host-native runs use localhost; Docker Compose overrides
  # via TELEMETRY_LOCAL_ENDPOINT=http://cloud-dashboard:8000/api/v1/telemetry
  # (edge container localhost ≠ the cloud-dashboard service).
  local_endpoint: "http://localhost:8000/api/v1/telemetry"
  push_interval_seconds: 5
  retry_backoff_seconds: 3
